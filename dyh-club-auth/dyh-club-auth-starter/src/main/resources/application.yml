server:
  port: ${AUTH_SERVER_PORT:3011}

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:dyh_club}?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf8&useSSL=${MYSQL_USE_SSL:false}&allowPublicKeyRetrieval=${MYSQL_ALLOW_PUBLIC_KEY_RETRIEVAL:true}
    username: ${MYSQL_USERNAME:dyh_club}
    password: ${MYSQL_PASSWORD:}
    type: com.alibaba.druid.pool.DruidDataSource
    druid:
      initial-size: ${DB_POOL_INITIAL_SIZE:2}
      min-idle: ${DB_POOL_MIN_IDLE:2}
      max-active: ${DB_POOL_MAX_ACTIVE:20}
      max-wait: 60000
      stat-view-servlet:
        enabled: ${DRUID_CONSOLE_ENABLED:false}
        url-pattern: /druid/*
        login-username: ${DRUID_ADMIN_USERNAME:admin}
        login-password: ${DRUID_ADMIN_PASSWORD:}
      filter:
        stat:
          enabled: true
          slow-sql-millis: 2000
          log-slow-sql: true
        wall:
          enabled: true
  redis:
    database: ${REDIS_DATABASE:1}
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:}
    timeout: 2s

dyh:
  auth:
    password-salt: ${AUTH_PASSWORD_SALT:change-me-before-production}
  user:
    default-avatar-url: ${DEFAULT_AVATAR_URL:}

logging:
  config: classpath:log4j2-spring.xml

sa-token:
  token-name: satoken
  timeout: 2592000
  active-timeout: -1
  is-concurrent: true
  is-share: true
  token-style: random-32
  is-log: true
  token-prefix: dyh
