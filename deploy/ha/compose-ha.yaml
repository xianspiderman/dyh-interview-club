x-sentinel: &sentinel
  image: redis:7.2-alpine
  command: ["sh", "-c", "cp /etc/redis/sentinel.conf /tmp/sentinel.conf && redis-sentinel /tmp/sentinel.conf"]
  volumes: ["./redis/sentinel.conf:/etc/redis/sentinel.conf:ro"]
  depends_on: [redis-master, redis-replica-1, redis-replica-2]
x-nacos: &nacos
  image: nacos/nacos-server:v2.4.0
  environment: &nacos-env
    MODE: cluster
    NACOS_SERVERS: nacos-1:8848 nacos-2:8848 nacos-3:8848
    SPRING_DATASOURCE_PLATFORM: mysql
    MYSQL_SERVICE_HOST: nacos-mysql
    MYSQL_SERVICE_DB_NAME: nacos
    MYSQL_SERVICE_USER: nacos
    MYSQL_SERVICE_PASSWORD: ${NACOS_DB_PASSWORD:-nacos-ha-local-only}
    NACOS_AUTH_ENABLE: "true"
    NACOS_AUTH_TOKEN: ${NACOS_AUTH_TOKEN:-VGhpcy1pcy1vbmx5LWEtbG9jYWwtSEEtZGVtby10b2tlbi0xMjM0NTY3OA==}
    NACOS_AUTH_IDENTITY_KEY: ${NACOS_AUTH_IDENTITY_KEY:-clubServerIdentity}
    NACOS_AUTH_IDENTITY_VALUE: ${NACOS_AUTH_IDENTITY_VALUE:-club-ha-local-only}
  depends_on:
    nacos-schema-init: {condition: service_completed_successfully}
  healthcheck:
    test: ["CMD-SHELL", "curl -fsS http://localhost:8848/nacos/v1/console/health/readiness || exit 1"]
    interval: 10s
    timeout: 5s
    retries: 30
    start_period: 30s
x-es: &es
  image: dyh-club-elasticsearch-ik:7.17.24
  environment: &es-env
    cluster.name: club-search-ha
    discovery.seed_hosts: es-1,es-2,es-3
    cluster.initial_master_nodes: es-1,es-2,es-3
    xpack.security.enabled: "false"
    bootstrap.memory_lock: "true"
    ES_JAVA_OPTS: -Xms1g -Xmx1g
  ulimits: {memlock: {soft: -1, hard: -1}}
services:
  redis-master:
    image: redis:7.2-alpine
    command: ["redis-server", "--appendonly", "yes", "--repl-diskless-sync", "yes"]
  redis-replica-1:
    image: redis:7.2-alpine
    command: ["redis-server", "--replicaof", "redis-master", "6379", "--appendonly", "yes"]
    depends_on: [redis-master]
  redis-replica-2:
    image: redis:7.2-alpine
    command: ["redis-server", "--replicaof", "redis-master", "6379", "--appendonly", "yes"]
    depends_on: [redis-master]
  sentinel-1: {<<: *sentinel}
  sentinel-2: {<<: *sentinel}
  sentinel-3: {<<: *sentinel}
  namesrv-1:
    image: apache/rocketmq:4.9.4
    command: sh mqnamesrv
  namesrv-2:
    image: apache/rocketmq:4.9.4
    command: sh mqnamesrv
  broker-master:
    image: apache/rocketmq:4.9.4
    environment: {NAMESRV_ADDR: "namesrv-1:9876;namesrv-2:9876"}
    command: sh mqbroker -c /home/rocketmq/conf/broker.conf
    volumes: ["./rocketmq/broker-master.conf:/home/rocketmq/conf/broker.conf:ro"]
    depends_on: [namesrv-1, namesrv-2]
  broker-slave:
    image: apache/rocketmq:4.9.4
    environment: {NAMESRV_ADDR: "namesrv-1:9876;namesrv-2:9876"}
    command: sh mqbroker -c /home/rocketmq/conf/broker.conf
    volumes: ["./rocketmq/broker-slave.conf:/home/rocketmq/conf/broker.conf:ro"]
    depends_on: [namesrv-1, namesrv-2, broker-master]
  nacos-mysql:
    image: mysql:8.0.39
    environment: {MYSQL_DATABASE: nacos, MYSQL_USER: nacos, MYSQL_PASSWORD: "${NACOS_DB_PASSWORD:-nacos-ha-local-only}", MYSQL_ROOT_PASSWORD: "${NACOS_DB_ROOT_PASSWORD:-nacos-root-ha-local-only}"}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    volumes:
      - nacos-mysql-data:/var/lib/mysql
      - ./nacos/mysql-schema.sql:/docker-entrypoint-initdb.d/01-nacos-2.4.0.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -unacos -p$${MYSQL_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 20s
  nacos-schema-init:
    image: mysql:8.0.39
    environment: {MYSQL_PASSWORD: "${NACOS_DB_PASSWORD:-nacos-ha-local-only}"}
    volumes: ["./nacos/mysql-schema.sql:/schema/mysql-schema.sql:ro"]
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        mysql -h nacos-mysql -unacos -p$${MYSQL_PASSWORD} nacos < /schema/mysql-schema.sql
        && test "$$(mysql -h nacos-mysql -unacos -p$${MYSQL_PASSWORD} -Nse
        \"SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='nacos' AND table_name IN
        ('config_info','config_info_aggr','config_info_beta','config_info_tag','config_tags_relation','group_capacity','his_config_info','tenant_capacity','tenant_info','users','roles','permissions')\")" = "12"
    depends_on:
      nacos-mysql: {condition: service_healthy}
  nacos-1:
    <<: *nacos
    ports: ["8848:8848"]
  nacos-2: {<<: *nacos}
  nacos-3: {<<: *nacos}
  es-1:
    <<: *es
    build: {context: ../.., dockerfile: deploy/elasticsearch/Dockerfile}
    environment: {<<: *es-env, node.name: es-1}
  es-2:
    <<: *es
    environment: {<<: *es-env, node.name: es-2}
  es-3:
    <<: *es
    environment: {<<: *es-env, node.name: es-3}
volumes:
  nacos-mysql-data:
