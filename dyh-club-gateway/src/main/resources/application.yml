server:
  port: ${GATEWAY_SERVER_PORT:5000}

spring:
  cloud:
    gateway:
      routes:
        - id: club-circle-sensitive-admin
          uri: ${CLUB_CIRCLE_URI:http://localhost:3024}
          predicates:
            - Path=/api/admin/sensitive-words/**
        - id: club-circle-content-admin
          uri: ${CLUB_CIRCLE_URI:http://localhost:3024}
          predicates:
            - Path=/api/admin/posts,/api/admin/comments,/api/admin/post/**,/api/admin/comment/**
        - id: club-auth-service
          uri: ${CLUB_AUTH_URI:http://localhost:3021}
          predicates:
            - Path=/api/auth/**
        - id: club-subject-service
          uri: ${CLUB_SUBJECT_URI:http://localhost:3022}
          predicates:
            - Path=/api/questions/**,/api/catalog/**,/api/search/**,/api/admin/**,/api/ops/**,/actuator/**
        - id: club-practice-service
          uri: ${CLUB_PRACTICE_URI:http://localhost:3023}
          predicates:
            - Path=/api/practices/**
        - id: club-circle-service
          uri: ${CLUB_CIRCLE_URI:http://localhost:3024}
          predicates:
            - Path=/api/community/**
        - id: oss
          uri: lb://dyh-club-oss-dev
          predicates:
            - Path=/oss/**
          filters:
            - StripPrefix=1
        - id: legacy-auth
          uri: lb://dyh-club-auth-dev
          predicates:
            - Path=/auth/**
          filters:
            - StripPrefix=1
        - id: legacy-subject
          uri: lb://dyh-club-subject-dev
          predicates:
            - Path=/subject/**
        - id: legacy-practice
          uri: lb://dyh-club-practice-dev
          predicates:
            - Path=/practice/**
        - id: legacy-circle
          uri: lb://dyh-club-circle-dev
          predicates:
            - Path=/circle/**
        - id: interview
          uri: lb://dyh-club-interview-dev
          predicates:
            - Path=/interview/**
  redis:
    database: ${REDIS_DATABASE:1}
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:}
    timeout: 2s

sa-token:
  token-name: satoken
  timeout: 2592000
  active-timeout: -1
  is-concurrent: true
  is-share: true
  token-style: uuid
  is-log: false
club:
  gateway:
    trust-forwarded-for: ${CLUB_GATEWAY_TRUST_FORWARDED_FOR:false}
